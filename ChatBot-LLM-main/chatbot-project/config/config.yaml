model:
  base_model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "float16"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./models/lora_adapter"
  num_train_epochs: 5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  eval_steps: 20
  save_strategy: "epoch"
  evaluation_strategy: "steps"
  max_seq_length: 512
  fp16: true
  logging_dir: "./logs"

paths:
  train_data: "./data/train_dataset.json"
  val_data: "./data/val_dataset.json"
  corpus_data: "./data/sanaullah_corpus.json"
  tokenizer_dir: "./models/tokenizer"
